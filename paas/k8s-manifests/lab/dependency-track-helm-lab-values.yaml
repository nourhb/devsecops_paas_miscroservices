# Kubernetes manifest for lab or hosted deploy
apiServer:
  service:
    type: NodePort
    nodePort: 32336
  nodeSelector:
    kubernetes.io/hostname: master
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
frontend:
  service:
    type: NodePort
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
