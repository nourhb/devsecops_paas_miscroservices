# 8GB lab: embedded H2 on PVC (survives pod restart), master node, httpGet probes.
community:
  enabled: true
image:
  tag: 9.9.8-community
postgresql:
  enabled: false
persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 2Gi
  annotations:
    helm.sh/resource-policy: keep
    paas.lab/retain: "true"
monitoringPasscode: paas-lab-monitor
initSysctl:
  enabled: false
initFs:
  enabled: false
prometheusExporter:
  enabled: false
# Do NOT set plugins.install=[] via --set (helm coerces to string and breaks template).
service:
  type: NodePort
  nodePort: 30900
nodeSelector:
  kubernetes.io/hostname: master
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
startupProbe:
  initialDelaySeconds: 120
  periodSeconds: 20
  failureThreshold: 90
  timeoutSeconds: 10
readinessProbe:
  exec: null
  httpGet:
    path: /api/system/status
    port: http
  initialDelaySeconds: 120
  periodSeconds: 20
  failureThreshold: 30
  timeoutSeconds: 10
livenessProbe:
  exec: null
  tcpSocket:
    port: http
  initialDelaySeconds: 300
  periodSeconds: 60
  failureThreshold: 20
  timeoutSeconds: 5
sonarProperties:
  sonar.web.javaOpts: "-Xmx256m -Xms128m -XX:+UseSerialGC"
  sonar.ce.javaOpts: "-Xmx256m -Xms128m -XX:+UseSerialGC"
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1280Mi
    cpu: "1"
