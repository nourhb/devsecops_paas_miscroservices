# 8GB lab: embedded H2 on PVC (survives pod restart), master node, httpGet probes.
community:
  enabled: true
image:
  tag: 9.9.8-community
postgresql:
  enabled: false
persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 2Gi
  annotations:
    helm.sh/resource-policy: keep
    paas.lab/retain: "true"
monitoringPasscode: paas-lab-monitor
initSysctl:
  enabled: false
initFs:
  enabled: false
prometheusExporter:
  enabled: false
# Do NOT set plugins.install=[] via --set (helm coerces to string and breaks template).
service:
  type: NodePort
  nodePort: 30900
nodeSelector:
  kubernetes.io/hostname: master
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
startupProbe:
  initialDelaySeconds: 120
  periodSeconds: 20
  failureThreshold: 90
  timeoutSeconds: 10
readinessProbe:
  exec: null
  httpGet:
    path: /api/system/status
    port: http
  initialDelaySeconds: 120
  periodSeconds: 20
  failureThreshold: 30
  timeoutSeconds: 10
livenessProbe:
  exec: null
  tcpSocket:
    port: http
  initialDelaySeconds: 300
  periodSeconds: 60
  failureThreshold: 20
  timeoutSeconds: 5
# 16GB lab (RAM upgraded from 8GB 20260702): web/ce/search were starved at 1280Mi total,
# causing ConnectException/EOFException server crashes under back-to-back scans — see
# paas.lab/ram-16gb-20260702 marker used by lab-sonarqube-fix-now.sh to detect this file version.
sonarProperties:
  sonar.web.javaOpts: "-Xmx1024m -Xms256m -XX:+UseSerialGC"
  sonar.ce.javaOpts: "-Xmx1024m -Xms256m -XX:+UseSerialGC"
  # NO -XX:+UseSerialGC here: bundled Elasticsearch hard-codes -XX:+UseG1GC in its own
  # jvm.options; appending SerialGC causes "Multiple garbage collectors selected" —
  # a fatal JVM init error that CrashLoopBackOff's forever (20260702 incident).
  sonar.search.javaOpts: "-Xmx768m -Xms512m"
resources:
  requests:
    memory: 1024Mi
    cpu: 250m
  limits:
    memory: 4608Mi
    cpu: "2"
