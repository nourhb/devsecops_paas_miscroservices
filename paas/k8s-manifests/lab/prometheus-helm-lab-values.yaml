# Lab kube-prometheus-stack — minimal footprint, NodePorts match probe-prometheus-lab.sh
prometheus:
  service:
    type: NodePort
    nodePort: 30536
  prometheusSpec:
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

grafana:
  enabled: true
  service:
    type: NodePort
    nodePort: 30083
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

defaultRules:
  create: true
